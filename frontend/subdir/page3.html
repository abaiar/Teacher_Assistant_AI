  <style>
    /* 重置所有默认样式并确保根元素占满整个视口 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      height: 100vh; /* 使用视口高度单位 */
      width: 100vw;  /* 使用视口宽度单位 */
      overflow: hidden;
      position: relative;
    }
    
    /* 确保#app容器完全填充body */
    #app {
      height: 100%;
      width: 100%;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }
    
    /* 确保WebSDK加载的内容也占满整个容器 */
    #app > * {
      height: 100% !important;
      width: 100% !important;
    }
  </style>
</head>

  <div id="app"></div>
