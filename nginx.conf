server {
    listen 80;
    server_name localhost;

    # 登录服务 (Login)
    location /login {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 智能批改 -> 试卷批改服务 (Paper_marking)
    location /intelligent-correction {
        proxy_pass http://backend:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 智能测验 -> 智能组卷服务 (Paper_composition)
    location /intelligent-quiz {
        proxy_pass http://backend:5002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 成绩分析 -> 成绩分析服务 (Achievement_analysis)
    # 注意：该服务目前缺失文件，暂不配置。等修复后可按需添加
    # location /score-analysis {
    #     proxy_pass http://backend:5003;
    #     ...
    # }

    # 代码审查 -> 代码批改服务 (Code_correction)
    location /code-review {
        proxy_pass http://backend:5004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 提示词竞技场 -> 提示词竞技场服务 (Prompt_arena)
    location /prompt-arena {
        proxy_pass http://backend:5005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 其他请求返回 404（防止意外暴露）
    location / {
        return 404;
    }
}